name: Deploy Frontend to Firebase Hosting

# Build the Vite SPA and deploy ONLY Firebase Hosting on every push to main.
# Functions are deployed from the backend repo, not here. Auth uses the
# FIREBASE_SERVICE_ACCOUNT secret (GCP service account JSON key) via ADC — no
# FIREBASE_TOKEN. The 8 VITE_ secrets are injected into the build step because
# Vite inlines VITE_-prefixed vars at build time.
on:
  push:
    branches: [main]

# JSON-key auth (not Workload Identity Federation), so no OIDC token is needed.
permissions:
  contents: read

# Avoid overlapping hosting deploys if commits land in quick succession.
concurrency:
  group: deploy-hosting-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # All 8 VITE_ vars are scoped to THIS step's env. Vite reads them from
      # process.env during `vite build` and inlines them into the bundle.
      # A missing VITE_BACKEND_URL throws in src (backendUrl.js), failing here.
      - name: Build
        run: npm run build
        env:
          VITE_BACKEND_URL: ${{ secrets.VITE_BACKEND_URL }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}

      # Writes the service account JSON to a temp file and exports
      # GOOGLE_APPLICATION_CREDENTIALS for subsequent steps. The Firebase CLI
      # then authenticates via Application Default Credentials (ADC).
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Install Firebase CLI (pinned)
        run: npm install -g firebase-tools@15.19.1

      # CI=true (set by GitHub Actions) + --non-interactive guarantees no
      # prompts. Scoped to hosting only so it never touches functions.
      - name: Deploy hosting
        run: >-
          firebase deploy
          --only hosting
          --project food-pantry-5fdb0
          --non-interactive
